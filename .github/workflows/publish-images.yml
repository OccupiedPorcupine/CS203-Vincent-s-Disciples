name: Publish AWS images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-aws-images
  cancel-in-progress: false

jobs:
  checks:
    name: Run CI
    if: >-
      github.repository == 'OccupiedPorcupine/CS203-Vincent-s-Disciples'
      && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ matrix.service }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            context: .
            dockerfile: deploy/aws/web.Dockerfile
          - service: backend
            context: backend
            dockerfile: backend/Dockerfile
          - service: ml
            context: ml
            dockerfile: ml/Dockerfile

    env:
      IMAGE_REGISTRY: ghcr.io/occupiedporcupine
      RELEASE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Build image
        env:
          SERVICE: ${{ matrix.service }}
          BUILD_CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --file "$DOCKERFILE" \
            --tag "$IMAGE_REGISTRY/chicky-$SERVICE:$RELEASE_TAG" \
            "$BUILD_CONTEXT"

      - name: Push image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          docker push "$IMAGE_REGISTRY/chicky-$SERVICE:$RELEASE_TAG"

      - name: Record published image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          printf '%s\n' \
            "Published: \`$IMAGE_REGISTRY/chicky-$SERVICE:$RELEASE_TAG\`" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Log out
        if: always()
        run: docker logout ghcr.io

  release:
    name: Publish deployment record
    needs: [checks, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Record exact published image digests
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          registry = "ghcr.io/occupiedporcupine"
          tag = os.environ["RELEASE_TAG"]
          images = {}

          for service in ("web", "backend", "ml"):
              image = f"{registry}/chicky-{service}"
              result = subprocess.check_output(
                  ["docker", "buildx", "imagetools", "inspect",
                   f"{image}:{tag}"],
                  text=True,
              )
              match = re.search(
                  r"^Digest:\s+(sha256:[a-f0-9]{64})\s*$",
                  result,
                  re.MULTILINE,
              )
              if not match:
                  raise SystemExit(f"Cannot determine digest for {service}")
              images[service] = f"{image}@{match.group(1)}"

          record = {
              "schema_version": 1,
              "commit": os.environ["GITHUB_SHA"],
              "release_tag": tag,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "images": images,
          }
          with open("deployment.json", "w") as file:
              json.dump(record, file, indent=2)
          print("Verified all three public images and recorded their digests.")
          PY

      - name: Create draft release with deployment record
        run: |
          gh release create "aws-$RELEASE_TAG" deployment.json \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "AWS deployment $RELEASE_TAG" \
            --notes "CI passed and all three application images were published. This record does not confirm deployment to EC2." \
            --draft \
            --latest=false

      - name: Publish completed release record
        run: |
          gh release edit "aws-$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --draft=false \
            --latest=false