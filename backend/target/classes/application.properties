# Application properties for the Spring Boot application
logging.level.root=WARN
logging.level.org.springframework.web=INFO

# Uncomment the following line to use OpenAI 
# I ain't dropping my key in here gang
# Configured as an environment variable
# spring.ai.openai.api-key=${OPENAI_KEY}

# H2 Database configuration
spring.datasource.url=jdbc:h2:mem:appdb;
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.show-sql=true
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.open-in-view=false
spring.h2.console.enabled=true


# Create and drop database schema on startup
# This is useful for development, but should be set to 'none' or 'validate'
spring.jpa.hibernate.ddl-auto=update

# Google OAuth Client ID.
# Configured as an environment variable
google.client-id=${GOOGLE_CLIENT_ID}

# Explicit comma-separated frontend allowlist for credentialed browser requests.
# We mostly use 5500, but the others should work too
# Reconfigure to other ports here on your own machine if you want to change where you port to/other ports are in used by some other apps
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5500}


#store session cookies data
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}