# Test settings. This file replaces src/main/resources/application.properties during tests,
# so tests never read a developer's .env and never connect to Supabase.
logging.level.root=WARN
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
google.client-id=test-client-id.apps.googleusercontent.com
app.cors.allowed-origins=http://localhost:5500
spring.session.jdbc.initialize-schema=never
app.assistant.provider=offline
app.assistant.openai.api-key=
app.assistant.openai.base-url=http://localhost:9
app.assistant.chat-model=gpt-6-luna
app.assistant.transcribe-model=gpt-transcribe
app.assistant.speech-model=gpt-4o-mini-tts
app.assistant.speech-voice=marin
app.assistant.plans.free.messages-per-day=10
app.assistant.plans.free.spoken-replies-per-day=2
app.assistant.plans.standard.messages-per-day=150
app.assistant.plans.standard.spoken-replies-per-day=60
app.assistant.plans.pro.messages-per-day=500
app.assistant.plans.pro.spoken-replies-per-day=200
app.assistant.prices.input-per-million-tokens=0.10
app.assistant.prices.cached-input-per-million-tokens=0.01
app.assistant.prices.output-per-million-tokens=0.50
app.assistant.prices.transcription-per-minute=0.0045
app.assistant.prices.speech-per-thousand-characters=0.017
app.assistant.prices.embedding-per-million-tokens=0.02
app.ml.base-url=http://localhost:9
app.base-url=http://localhost:5500
app.mail.from=Chicky <no-reply@chicky.test>
app.auth.rate-limits.enabled=false
# Never call data.gov.sg from tests (HawkerCentreSyncServiceTest uses a fake server).
app.nea.hawker-centre-sync.enabled=false
# Nor NEA's outlook or Open-Meteo (WeatherServiceTest uses a fake server).
app.weather.enabled=false
# The real /api/health settings, so HealthApiTest checks them.
spring.config.import=classpath:health.properties

# As in the main settings, so upload limits are tested as they run (Spring's default is 1 MB).
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
app.documents.embedding-model=text-embedding-3-small
app.documents.embedding-dimensions=1536
app.documents.min-similarity=0.25
app.documents.top-k=5
