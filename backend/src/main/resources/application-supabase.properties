# Supabase profile. Activate with spring.profiles.active=supabase in .env.
# Note: SPRING_PROFILES_ACTIVE=supabase does NOT work inside .env; it is silently ignored.

# No fallbacks: the app fails to start if any of these are missing, instead of quietly using H2.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# New Supabase projects are not empty: "Enable automatic RLS" installs public.rls_auto_enable(),
# and Flyway refuses to migrate a non-empty schema it has no history for. Baselining at version 0
# records that starting point and still runs every migration from V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Supabase's free tier allows few connections; keep each running backend small.
spring.datasource.hikari.maximum-pool-size=5

# Never expose the H2 web console next to real user data.
spring.h2.console.enabled=false

spring.jpa.show-sql=false
