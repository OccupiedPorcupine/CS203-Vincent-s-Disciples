# Supabase profile. Activate with spring.profiles.active=supabase in .env.
# Note: SPRING_PROFILES_ACTIVE=supabase does NOT work inside .env; it is silently ignored.

# No fallbacks: the app fails to start if any of these are missing, instead of quietly using H2.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Supabase's free tier allows few connections; keep each running backend small.
spring.datasource.hikari.maximum-pool-size=5

# Never expose the H2 web console next to real user data.
spring.h2.console.enabled=false

spring.jpa.show-sql=false
