# GET /api/health for uptime checks (issue #48): 200 with {"status":"UP"} when the database
# answers, 503 when it doesn't. The ML service shows as DEGRADED when it's down, which still
# returns 200 because forecasts fall back to the baseline. Only statuses are shown, no details.
management.endpoints.web.base-path=/api
management.endpoints.web.discovery.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
management.endpoint.health.status.order=down,out-of-service,unknown,degraded,up
management.endpoint.health.status.http-mapping.degraded=200
# Email is sent in the background, so it doesn't decide health.
management.health.mail.enabled=false
management.health.diskspace.enabled=false
# Kubernetes probes and certificate checks don't apply on Vercel; leave db, ml and ping.
management.endpoint.health.probes.enabled=false
management.health.ssl.enabled=false
