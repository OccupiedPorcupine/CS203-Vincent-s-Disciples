# Production profile (issue #49). Activate with SPRING_PROFILES_ACTIVE=supabase,prod.
# ProductionSettingsCheck stops the app from starting if any of these are overridden with an
# insecure value, or if MAIL_HOST, APP_BASE_URL or the database aren't set for production.

spring.h2.console.enabled=false
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}

# The API docs stay private unless SWAGGER_ENABLED=true is set on purpose.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

spring.jpa.show-sql=false
