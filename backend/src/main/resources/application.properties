# Application properties for the Spring Boot application
logging.level.root=WARN
logging.level.org.springframework.web=INFO
# Flyway logs "Database: jdbc:..." on startup, so you can see whether you are on H2 or Supabase
logging.level.org.flywaydb=INFO
# Logs the size of the app guide sent to the model with each message (see IndexGuideRetriever)
logging.level.app.assistant=INFO

# Local settings and secrets live in a gitignored .env file (see backend/.env.example).
# Both paths are listed so it is found whether you start the app from backend/ or the repo root.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# Hosts such as Vercel tell the app which port to listen on through PORT.
server.port=${PORT:8080}
# Set to "framework" behind a proxy that terminates HTTPS (Vercel), so the app sees the
# original https address in X-Forwarded-* headers. Leave as none when nothing sits in front.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# The Python ML service (ml/api). On Vercel, the ml service binding sets ML_SERVICE_URL.
app.ml.base-url=${ML_SERVICE_URL:http://localhost:8000}

# Voice assistant. "openai" uses the models below and needs OPENAI_API_KEY in .env (never commit it).
# "offline" is a rule-based stand-in that understands typed sales such as "chicken rice 42",
# for demos and development without a key; it has no voice input.
app.assistant.provider=${ASSISTANT_PROVIDER:openai}
app.assistant.openai.api-key=${OPENAI_API_KEY:}
app.assistant.openai.base-url=https://api.openai.com/v1
app.assistant.chat-model=gpt-6-luna
app.assistant.transcribe-model=gpt-transcribe
# Spoken replies. OpenAI shuts gpt-4o-mini-tts down on 6 January 2027 (its replacement is the Realtime API).
app.assistant.speech-model=gpt-4o-mini-tts
app.assistant.speech-voice=marin

# H2 Database configuration (default for local development; data is lost on restart)
# To use Supabase instead, set spring.profiles.active=supabase in .env (see database/README.md)
# MODE=PostgreSQL keeps H2 close to Supabase so the same migrations run on both
spring.datasource.url=jdbc:h2:mem:appdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.jpa.show-sql=true
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Uploaded training files are kept outside the repository. Metadata is stored in the database.
app.training-data.storage-path=${TRAINING_DATA_STORAGE_PATH:../.local-data/training-data}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB


# Tables are created by Flyway migrations in src/main/resources/db/migration/, not by Hibernate.
# 'validate' makes the app refuse to start if an entity no longer matches the tables,
# so every entity change needs a new migration file (see database/README.md).
spring.jpa.hibernate.ddl-auto=validate
# common/ runs everywhere; {vendor} resolves to h2 or postgresql for database-specific SQL
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}

# Login sessions are stored in the spring_session tables (created by Flyway V3), so users stay
# logged in across restarts. Flyway owns the tables, so Spring must not create them itself.
spring.session.jdbc.initialize-schema=never

# Google OAuth Client ID.
# Configured as an environment variable
google.client-id=${GOOGLE_CLIENT_ID}

# Explicit comma-separated frontend allowlist for credentialed browser requests.
# We mostly use 5500, but the others should work too
# Reconfigure to other ports here on your own machine if you want to change where you port to/other ports are in used by some other apps
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5500}


#store session cookies data
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.cookie-name=XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name=X-XSRF-TOKEN
