<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chicky Dashboard</title>
  <!-- Read by js/api.js to reach the backend. -->
  <meta name="api-base-url" content="http://localhost:8080">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Kaisei+HarunoUmi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="./css/assistant.css">
  <link rel="stylesheet" href="./css/guide.css">
</head>
<body>
  <header class="topbar">
    <details class="navigation" data-guide-id="main-menu">
      <summary aria-label="Toggle navigation"><img src="images/dashboard/sidebar.svg" alt=""></summary>
      <nav aria-label="Main navigation">
        <a href="dashboard.html" aria-current="page">Dashboard</a>
        <a href="forecast.html" data-guide-id="nav-forecast">Demand Forecast</a>
        <a href="data.html" data-guide-id="nav-data">Data ingestion</a>
      </nav>
    </details>
    <img class="avatar" src="images/dashboard/avatar.png" width="40" height="40" alt="User profile">
  </header>

  <main class="dashboard">
    <div class="overview">
      <section class="welcome" aria-labelledby="welcome-heading">
        <h1 id="welcome-heading">Welcome, USER</h1>
        <p>Review this week’s performance</p>
      </section>
      <!-- Filled from the signed-in user's daily sales by js/dashboard.js. -->
      <section class="graph demand" aria-labelledby="demand-heading" data-guide-id="demand-chart">
        <div class="headline">
          <h2 id="demand-heading">Demand, latest 7 days</h2>
          <span class="number"><span id="demand-total">--</span><span class="unit"> portions</span></span>
          <span class="note" id="demand-note">Loading sales&hellip;</span>
        </div>
        <div class="chart">
          <canvas id="demand-chart" role="img" aria-label="Line chart of portions sold each day, all dishes combined"></canvas>
        </div>
      </section>
      <section class="graph by-dish" aria-labelledby="dish-heading" data-guide-id="dish-chart">
        <div class="headline">
          <h2 id="dish-heading">Demand by dish</h2>
          <span class="note" id="dish-note">Same 7 days</span>
        </div>
        <div class="chart">
          <canvas id="dish-chart" role="img" aria-label="Bar chart of portions sold per dish over the same 7 days"></canvas>
        </div>
      </section>
    </div>

    <section class="actions" aria-labelledby="actions-heading" data-guide-id="actions-needed">
      <h2 id="actions-heading">Actions Needed</h2>
      <div class="divider" aria-hidden="true"><img src="images/dashboard/divider.svg" alt=""></div>
      <div class="checklist">
        <label class="check-field"><input type="checkbox" checked aria-describedby="action-one-description"><span>Label<span class="description" id="action-one-description">Description</span></span></label>
        <label class="check-field"><input type="checkbox" checked aria-describedby="action-two-description"><span>Label<span class="description" id="action-two-description">Description</span></span></label>
      </div>
    </section>

    <!-- Sends to the voice assistant (js/assistant.js), which opens its panel to reply. -->
    <section class="chat-box" aria-label="AI assistant" data-guide-id="assistant-chat">
      <textarea aria-label="Message to AI assistant" placeholder="What would you like to know?"></textarea>
      <div class="chat-toolbar">
        <label class="icon-button attachment" title="Attach an image"><input type="file" accept="image/*" aria-label="Attach an image"><img src="images/dashboard/icon4.svg" alt=""></label>
        <button class="icon-button" type="button" disabled title="Code input is not connected" aria-label="Code input"><img src="images/dashboard/icon1.svg" alt=""></button>
        <button class="icon-button" type="button" disabled title="Voice input" aria-label="Voice input"><img src="images/dashboard/icon7.svg" alt=""></button>
        <button class="icon-button send" type="button" disabled title="Send message" aria-label="Send message"><img src="images/dashboard/icon3.svg" alt=""></button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/dashboard.js"></script>
  <script src="./js/guide.js"></script>
  <script src="./js/assistant.js"></script>
</body>
</html>
