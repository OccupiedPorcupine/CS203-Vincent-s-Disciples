<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chicky Dashboard</title>
  <!-- Read by js/api.js; without it the login check below the graphs never ran. -->
  <meta name="api-base-url" content="http://localhost:8080">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Kaisei+HarunoUmi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <header class="topbar">
    <details class="navigation">
      <summary aria-label="Toggle navigation"><img src="images/dashboard/sidebar.svg" alt=""></summary>
      <nav aria-label="Main navigation">
        <a href="dashboard.html" aria-current="page">Dashboard</a>
        <a href="forecast.html">Demand Forecast</a>
      </nav>
    </details>
    <img class="avatar" src="images/dashboard/avatar.png" width="40" height="40" alt="User profile">
  </header>

  <main class="dashboard">
    <div class="overview">
      <section class="welcome" aria-labelledby="welcome-heading">
        <h1 id="welcome-heading">Welcome, USER</h1>
        <p>Review this week’s performance</p>
      </section>
      <!-- Graphs show sample data (js/dashboard.js) until the dashboard reads sales from the backend. -->
      <section class="graph demand" aria-labelledby="demand-heading">
        <div class="headline">
          <h2 id="demand-heading">Demand this week</h2>
          <span class="number"><span id="demand-total">--</span><span class="unit"> portions</span></span>
          <span class="note">Sample data &middot; Mon to Sun</span>
        </div>
        <div class="chart">
          <canvas id="demand-chart" role="img" aria-label="Line chart of portions sold each day this week"></canvas>
        </div>
      </section>
      <section class="graph revenue" aria-labelledby="revenue-heading">
        <div class="headline">
          <h2 id="revenue-heading">Revenue this week</h2>
          <span class="number"><span id="revenue-total">--</span></span>
          <span class="note">Sample data &middot; Mon to Sun</span>
        </div>
        <div class="chart">
          <canvas id="revenue-chart" role="img" aria-label="Line chart of revenue each day this week"></canvas>
        </div>
      </section>
    </div>

    <section class="actions" aria-labelledby="actions-heading">
      <h2 id="actions-heading">Actions Needed</h2>
      <div class="divider" aria-hidden="true"><img src="images/dashboard/divider.svg" alt=""></div>
      <div class="checklist">
        <label class="check-field"><input type="checkbox" checked aria-describedby="action-one-description"><span>Label<span class="description" id="action-one-description">Description</span></span></label>
        <label class="check-field"><input type="checkbox" checked aria-describedby="action-two-description"><span>Label<span class="description" id="action-two-description">Description</span></span></label>
      </div>
    </section>

    <!-- Connect these controls to a chat service when adding application logic. -->
    <section class="chat-box" aria-label="AI assistant">
      <textarea aria-label="Message to AI assistant" placeholder="What would you like to know?"></textarea>
      <div class="chat-toolbar">
        <label class="icon-button attachment" title="Attach an image"><input type="file" accept="image/*" aria-label="Attach an image"><img src="images/dashboard/icon4.svg" alt=""></label>
        <button class="icon-button" type="button" disabled title="Code input is not connected" aria-label="Code input"><img src="images/dashboard/icon1.svg" alt=""></button>
        <button class="icon-button" type="button" disabled title="Voice input is not connected" aria-label="Voice input"><img src="images/dashboard/icon7.svg" alt=""></button>
        <button class="icon-button send" type="button" disabled title="Chat service is not connected" aria-label="Send message"><img src="images/dashboard/icon3.svg" alt=""></button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/dashboard.js"></script>
</body>
</html>
