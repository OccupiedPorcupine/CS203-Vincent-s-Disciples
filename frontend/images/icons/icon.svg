  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="none" stroke="#fffcf5" stroke-width="14" stroke-linecap="round" opacity="0.75">
    <path d="M206 168c-16-20 16-34 0-56"/>
    <path d="M256 160c-16-20 16-34 0-56"/>
    <path d="M306 168c-16-20 16-34 0-56"/>
  </g>
