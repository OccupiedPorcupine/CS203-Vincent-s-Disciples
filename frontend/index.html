<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in to Chicky</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaisei+HarunoUmi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
  <main class="sign-in-card">
    <div class="visual-placeholder" aria-hidden="true">PLACEHOLDER</div>

    <section class="sign-in-panel" aria-labelledby="welcome-heading">
      <h1 id="welcome-heading">Welcome back to <span>Chicky</span></h1>

      <form class="sign-in-form" action="#" method="post">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="Email Address" autocomplete="email" required>
        </div>

        <div class="field password-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
          <a class="forgot-password" href="#">Forgot Password?</a>
        </div>

        <button class="primary-button login-button" type="submit">Log In</button>
      </form>

      <div class="separator"><span>OR</span></div>

      <button class="google-button" type="button">
        <img src="./images/google-icon.png" alt="" width="20" height="20">
        <span>Sign in with Google</span>
      </button>

      <div class="sign-up-row">
        <span>Don’t have an account?</span>
        <a class="primary-button sign-up-button" href="#">Sign Up</a>
      </div>
    </section>
  </main>
</body>
</html>
