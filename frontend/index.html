<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Public runtime configuration. Google configuration is loaded from the backend. -->
  <meta name="api-base-url" content="http://localhost:8080">


  <title>Sign in to Chicky</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaisei+HarunoUmi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
  <main class="sign-in-card">
    <div class="visual-placeholder" aria-hidden="true">PLACEHOLDER</div>

    <section id="login-panel" class="sign-in-panel" aria-labelledby="welcome-heading">
      <h1 id="welcome-heading">Welcome back to <span>Chicky</span></h1>

      <form id="login-form" class="sign-in-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="Email Address" autocomplete="email" required>
        </div>

        <div class="field password-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
          <a class="forgot-password" href="#">Forgot Password?</a>
        </div>

        <button class="primary-button login-button" type="submit">Log In</button>
      </form>

      <p id="login-status" class="form-status" role="status" aria-live="polite"></p>

      <div class="separator"><span>OR</span></div>

      <!-- Google Identity Services button, so we are using the default font. -->
      <div id="google-button" class="google-button-container"></div>
      <p id="google-help" class="google-help" hidden>
        <!--it will throw this error if client id is not inputted, but i think bean creation throws this first anyway if you initialise backend first-->
        Google sign-in is not configured on the backend.
      </p>

      <div class="sign-up-row">
        <span>Don’t have an account?</span>
        <button id="show-signup" class="primary-button sign-up-button" type="button">Sign Up</button>
      </div>
    </section>

    <!--this part, in fact, is NOT designed yet!!!-->
    <!--it's for signing up-->
    <section id="signup-panel" class="sign-in-panel" aria-labelledby="signup-heading" hidden>
      <h1 id="signup-heading">Create your <span>Chicky account</span></h1>

      <form id="signup-form" class="sign-in-form">
        <div class="field">
          <label for="signup-name">Name</label>
          <input id="signup-name" name="name" type="text" placeholder="Your name" autocomplete="name" maxlength="100" required>
        </div>

        <div class="field">
          <label for="signup-email">Email</label>
          <input id="signup-email" name="email" type="email" placeholder="Email Address" autocomplete="email" maxlength="254" required>
        </div>

        <div class="field">
          <label for="signup-password">Password</label>
          <input id="signup-password" name="password" type="password" placeholder="At least 12 characters" autocomplete="new-password" minlength="12" maxlength="256" required>
        </div>

        <div class="field">
          <label for="signup-confirm-password">Confirm password</label>
          <input id="signup-confirm-password" name="confirmPassword" type="password" placeholder="Repeat password" autocomplete="new-password" minlength="12" maxlength="256" required>
        </div>

        <button class="primary-button form-submit-button" type="submit">Create Account</button>
      </form>

      <p id="signup-status" class="form-status" role="status" aria-live="polite"></p>

      <div class="sign-up-row">
        <span>Already have an account?</span>
        <button id="show-login" class="text-button" type="button">Log In</button>
      </div>
    </section>

    <section id="account-panel" class="sign-in-panel account-panel" aria-labelledby="account-heading" hidden>
      <p class="eyebrow">Signed in</p>
      <h1 id="account-heading">Welcome to <span>Chicky</span></h1>
      <img id="account-picture" class="account-picture" alt="" hidden>
      <p id="account-name" class="account-name"></p>
      <p id="account-email" class="account-email"></p>
      <button id="logout-button" class="primary-button logout-button" type="button">Log Out</button>
      <p id="account-status" class="form-status" role="status" aria-live="polite"></p>
    </section>

  </main>
  <script src="./js/auth.js" defer></script>
</body>
</html>
