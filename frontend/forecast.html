<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Same backend address as index.html. Only used once USE_MOCK_DATA is false in js/forecast.js. -->
  <meta name="api-base-url" content="http://localhost:8080">

  <title>Demand forecast · Chicky</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaisei+HarunoUmi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/forecast.css">
</head>

<body>
  <!-- Top bar -->
  <header class="topbar">
    <button type="button" class="icon-button" id="sidebar-toggle" aria-controls="sidebar" aria-expanded="false" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></svg>
    </button>
    <div class="topbar-title">
      <h1>Demand Forecast</h1>
      <p>Predict demand, plan better and reduce food waste.</p>
    </div>
    <a class="avatar" href="./index.html" aria-label="Your account" id="avatar">C</a>
  </header>

  <!-- Sidebar (hidden until the toggle is pressed) -->
  <nav class="sidebar" id="sidebar" aria-label="Main" hidden>
    <p class="sidebar-brand">Chicky</p>
    <ul>
      <li><a href="./forecast.html" aria-current="page">Demand forecast</a></li>
      <li><a href="./inventory.html">Inventory</a></li>
      <li><a href="./index.html">Account</a></li>
    </ul>
  </nav>
  <div class="scrim" id="scrim" hidden></div>

  <main class="page">
    <!-- Controls -->
    <section class="card controls" aria-label="Forecast settings">
      <div class="control">
        <label for="dish-select">Select dish / item</label>
        <div class="select-wrap">
          <select id="dish-select"></select>
        </div>
      </div>
      <fieldset class="control period-control">
        <legend>Forecast period</legend>
        <div class="period-buttons">
          <button type="button" class="period-button" data-days="1" aria-pressed="true">1 day</button>
          <button type="button" class="period-button" data-days="2" aria-pressed="false">2 days</button>
          <button type="button" class="period-button" data-days="4" aria-pressed="false">4 days</button>
        </div>
      </fieldset>
    </section>

    <div class="content-grid">
      <!-- Prediction graph -->
      <section class="card chart-card" aria-labelledby="chart-heading">
        <h2 id="chart-heading" class="visually-hidden">Predicted demand</h2>
        <div class="headline" id="headline" aria-live="polite"></div>

        <div class="chart-toolbar">
          <div class="view-toggle" role="group" aria-label="Chart view">
            <button type="button" class="view-button" data-view="recent" aria-pressed="true">Last 7 days</button>
            <button type="button" class="view-button" data-view="weekday" aria-pressed="false" id="weekday-view-button">Same weekday</button>
          </div>
          <div class="legend" id="legend" aria-hidden="true"></div>
        </div>

        <div class="chart" id="chart" role="img" aria-label="Chart of past sales and forecast demand"></div>
        <p class="chart-note" id="chart-note"></p>
        <p class="status" id="status" role="status"></p>
      </section>

      <div class="side-column">
        <!-- Factors -->
        <section class="card side-card" aria-labelledby="factors-heading">
          <h2 id="factors-heading">Factors affecting demand</h2>
          <div class="factors">
            <div class="factor">
              <h3>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                Weather
              </h3>
              <ul id="weather-list"></ul>
            </div>
            <div class="factor">
              <h3>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
                Local event
              </h3>
              <ul id="event-list"></ul>
            </div>
          </div>
        </section>

        <!-- Ask about forecast (chat) -->
        <section class="card side-card chat-card" aria-labelledby="chat-heading">
          <h2 id="chat-heading">Ask about forecast</h2>
          <ol class="messages" id="messages" aria-live="polite"></ol>
          <div class="suggestions" id="suggestions"></div>
          <form class="chat-form" id="chat-form">
            <label for="chat-input" class="visually-hidden">Ask a question about this forecast</label>
            <input id="chat-input" type="text" placeholder="Why is it this number?" autocomplete="off" maxlength="300">
            <button type="submit" class="send-button">Ask</button>
          </form>
        </section>
      </div>
    </div>
  </main>

  <script src="./js/forecast.js"></script>
</body>
</html>
