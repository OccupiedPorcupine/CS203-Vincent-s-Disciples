# Runs the stack against Supabase instead of the local Postgres container.
# Usage: docker compose -f compose.yaml -f compose.supabase.yaml up --build backend ml-service frontend
# Reads the Supabase variables from .env (see .env.example).
services:
  backend:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      FLYWAY_URL: ${FLYWAY_URL}
      FLYWAY_USERNAME: ${FLYWAY_USERNAME}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-raw-sources}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY}
    depends_on: !override
      ml-service:
        condition: service_started
